<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Just4you.th | Your 3D Character</title>

  <script type="module"
    src="https://unpkg.com/@google/model-viewer@4.1.0/dist/model-viewer.min.js">
  </script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      color: #342e37;
      background: #faf7f3;
    }

    main {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 20px;
      max-width: 1000px;
      margin: auto;
    }

    header, footer { text-align: center; }

    header small {
      font-weight: 700;
      letter-spacing: 2px;
      color: #9b6272;
    }

    h1 { font-size: 24px; margin: 10px 0 6px; }
    p { font-size: 14px; color: #766e79; }

    .viewer {
      flex: 1;
      min-height: 0;
      position: relative;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background: transparent;
      touch-action: none;
    }

    #status {
      position: absolute;
      left: 16px;
      right: 16px;
      top: 16px;
      text-align: center;
      pointer-events: none;
      color: #766e79;
      font-size: 14px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    button {
      border: 1px solid #ded5dc;
      border-radius: 999px;
      padding: 12px 20px;
      background: white;
      color: #342e37;
      font: inherit;
      cursor: pointer;
    }

    button:disabled { opacity: .45; cursor: default; }
    button:hover:not(:disabled) { background: #f0e8ed; }

    footer { padding-bottom: env(safe-area-inset-bottom); }
  </style>
</head>

<body>
  <main>
    <header>
      <small>JUST4YOU.TH</small>
      <h1>Your little character</h1>
      <p>A little version of you, brought to life.</p>
    </header>

    <div class="viewer">
      <model-viewer
        id="character"
        src="./models/test%202.glb"
        alt="Your personalized animated 3D character"
        camera-controls
        disable-pan
        disable-tap
        touch-action="none"
        camera-target="auto auto auto"
        camera-orbit="0deg 75deg 105%"
        min-camera-orbit="auto 10deg 35%"
        max-camera-orbit="auto 170deg 200%"
        field-of-view="30deg"
        shadow-intensity="0.8"
        shadow-softness="1"
        exposure="1"
        autoplay
        loading="eager">
      </model-viewer>

      <div id="status" role="status">Loading your character…</div>
    </div>

    <footer>
      <div class="controls">
        <button id="reset" type="button">Reset view</button>
        <button id="animation" type="button" disabled>
          Pause animation
        </button>
      </div>
      <p>Drag to rotate · Pinch or scroll to resize</p>
    </footer>
  </main>

  <script>
    const viewer = document.querySelector("#character");
    const status = document.querySelector("#status");
    const animationButton = document.querySelector("#animation");

    viewer.addEventListener("load", () => {
      status.hidden = true;

      const animations = viewer.availableAnimations;

      if (animations.length > 0) {
        viewer.animationName = animations[0];
        viewer.play();
        animationButton.disabled = false;
        animationButton.textContent = "Pause animation";
      } else {
        animationButton.textContent = "No animation";
      }
    });

    viewer.addEventListener("error", () => {
      status.hidden = false;
      status.textContent =
        'Could not load the model. Check that "test 2.glb" is in the same folder as index.html.';
    });

    document.querySelector("#reset").addEventListener("click", () => {
      viewer.cameraTarget = "auto auto auto";
      viewer.cameraOrbit = "0deg 75deg 105%";
      viewer.fieldOfView = "30deg";
    });

    animationButton.addEventListener("click", () => {
      if (viewer.paused) {
        viewer.play();
        animationButton.textContent = "Pause animation";
      } else {
        viewer.pause();
        animationButton.textContent = "Play animation";
      }
    });
  </script>
</body>
</html>
